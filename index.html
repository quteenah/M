<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALI STORE VIP | المتجر الفاخر</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">ALI STORE <span>VIP</span></div>
    <button class="cart-btn" onclick="openCart()">🛒 السلة (<span id="cartCount">0</span>)</button>
  </header>

  <section class="hero">
    <h1>خدمات رقمية حصرية بمستوى VIP</h1>
    <p>شحن ألعاب، تطوير مواقع، وبوتات ذكية بأسرع تنفيذ وأعلى أمان</p>
  </section>

  <div class="controls">
    <div class="search-box">
      <input type="text" id="search" placeholder="🔍 ابحث عن الخدمة المطلوبة..." oninput="renderProducts()">
    </div>
    <div class="filters">
      <button class="active" onclick="filterCat('all', this)">الكل</button>
      <button onclick="filterCat('games', this)">🎮 شحن الألعاب</button>
      <button onclick="filterCat('web', this)">🌐 المواقع</button>
      <button onclick="filterCat('bot', this)">🤖 البوتات</button>
    </div>
  </div>

  <main class="grid" id="products"></main>

  <script src="app.js"></script>
</body>
</html>
