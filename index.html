<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALI STORE VIP | المتجر الإلكتروني الرسمي</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- شريط العروض العلوي -->
  <div class="top-bar">⚡ خصم خاص 20% على خدمات التطوير وشحن الألعاب بأسعار تسليم فورية ⚡</div>

  <!-- الهيدر -->
  <header>
    <div class="brand">👑 ALI STORE <span>VIP</span></div>
    <button class="cart-trigger" onclick="openCart()">🛒 السلة (<span id="cartCount">0</span>)</button>
  </header>

  <!-- شريط الثقة -->
  <div class="trust-bar">
    <div class="trust-item">⚡ تسليم فوري للطلبات</div>
    <div class="trust-item">🛡️ دفع آمن عبر USDT</div>
    <div class="trust-item">💬 دعم فني مباشر</div>
  </div>

  <!-- التصفح والبحث -->
  <div class="store-nav">
    <input type="text" class="search-input" id="search" placeholder="🔍 ابحث عن المنتجات والخدمات الرقمية..." oninput="renderProducts()">
    <div class="cat-tabs">
      <button class="cat-btn active" onclick="filterCat('all', this)">جميع المنتجات</button>
      <button class="cat-btn" onclick="filterCat('games', this)">🎮 شحن الألعاب</button>
      <button class="cat-btn" onclick="filterCat('web', this)">🌐 تطوير المواقع</button>
      <button class="cat-btn" onclick="filterCat('bot', this)">🤖 البوتات والخدمات</button>
    </div>
  </div>

  <!-- شبكة المنتجات -->
  <main class="products-grid" id="products"></main>

  <script src="app.js"></script>
</body>
</html>
